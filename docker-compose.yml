services:
  # Postgres is the supported deployment target (ROADMAP 4.0). SQLite still
  # works and remains the default for a bare `uvicorn` run with no server to
  # install, but a Compose stack is a deployment, so it gets the real database.
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lensword}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lensword}
      POSTGRES_DB: ${POSTGRES_DB:-lensword}
    volumes:
      - lensword_pgdata:/var/lib/postgresql/data
    # Not published to the host. Nothing outside this stack needs to reach the
    # database, and the default credentials above are only safe as long as it
    # is unreachable — override them for anything real.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lensword} -d ${POSTGRES_DB:-lensword}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./apps/backend
    ports:
      - "18420:8000"
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-lensword}:${POSTGRES_PASSWORD:-lensword}@db:5432/${POSTGRES_DB:-lensword}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-this-is-not-secure}
      ACCESS_TOKEN_EXPIRE_MINUTES: "10080"
      CORS_ORIGINS: '["http://localhost:18421","http://localhost:5173"]'
      FIRST_ADMIN_EMAIL: ${FIRST_ADMIN_EMAIL:-}
      FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD:-}
      # Local AI mnemonic suggestions via Ollama — off by default (AI_PROVIDER
      # defaults to "none" both here and in the app itself, so an unset .env
      # keeps this feature off exactly as before these lines existed). See
      # docs/install/local-ai-ollama.md, in particular "Running the backend
      # in Docker with Ollama on the host" for OLLAMA_BASE_URL — Compose's
      # network namespace means `localhost` inside this container is *not*
      # the host machine.
      AI_PROVIDER: ${AI_PROVIDER:-none}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://localhost:11434}
      # Remote MCP over Streamable HTTP + OAuth (issue #196) — off by
      # default. See docs/reference/mcp-remote-transport.md before turning
      # this on; it requires TLS terminated in front of this backend, which
      # this Compose stack does not set up.
      REMOTE_MCP_ENABLED: ${REMOTE_MCP_ENABLED:-false}
      MCP_ISSUER_URL: ${MCP_ISSUER_URL:-http://localhost:8000}
    depends_on:
      # `service_healthy`, not a bare depends_on: the container starts by
      # running migrations, so a Postgres that is merely *started* is not
      # enough — it has to be accepting connections.
      db:
        condition: service_healthy
    volumes:
      - lensword_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./apps/frontend
      args:
        VITE_API_URL: http://localhost:18420
    ports:
      - "18421:80"
    depends_on:
      - backend

volumes:
  # Still mounted with Postgres in use: the AI settings file lives here, and a
  # deployment that switches DATABASE_URL back to SQLite keeps its data.
  lensword_data:
  lensword_pgdata:
