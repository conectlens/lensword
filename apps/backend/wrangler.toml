# Deploys apps/backend as a Cloudflare Container — a real Docker container
# running the existing FastAPI/Alembic/Postgres image (see ../Dockerfile),
# not a rewrite into the classic V8-isolate Worker model. A Worker still
# fronts it (cf-worker/index.ts): Cloudflare Containers are addressed
# through a Durable Object binding, so every request still passes through
# a (very small) Worker that forwards it to the running container.
#
# NEEDS VERIFICATION AGAINST CURRENT CLOUDFLARE DOCS before first deploy —
# written from the documented Containers + Durable Objects binding pattern,
# not tested against a live account from this environment. Check
# https://developers.cloudflare.com/containers/ for the current schema
# before relying on this.
name = "lensword-backend"
main = "cf-worker/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Custom domain — requires conectlens.com to already be an active zone on
# this same Cloudflare account (Websites -> Add a site). Confirmed syntax:
# developers.cloudflare.com/workers/configuration/routing/custom-domains/.
# Remove this block (or point it elsewhere) if lensword-api.conectlens.com
# isn't ready yet — the Worker still deploys and is reachable at its
# default *.workers.dev URL either way.
[[routes]]
pattern = "lensword-api.conectlens.com"
custom_domain = true

[[containers]]
class_name = "BackendContainer"
image = "./Dockerfile"
# One instance to start: this backend uses an in-process APScheduler job
# store (SCHEDULER_JOB_STORE=database avoids duplicate firing across
# instances — see .env.example) and hasn't been load-tested past one
# instance. Raise once that's actually verified.
max_instances = 1
# /api/v1/health exists (apps/backend/app/main.py) — wire it here once the
# exact health-check config key is confirmed against current docs; omitted
# rather than guessed.

[[durable_objects.bindings]]
name = "BACKEND_CONTAINER"
class_name = "BackendContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BackendContainer"]

# Secrets (set via `wrangler secret put <NAME>` or the dashboard — never
# committed here): DATABASE_URL, SECRET_KEY, and anything else in
# ../.env.example beyond the defaults. See docs/internal/cloudflare-deployment.md.
