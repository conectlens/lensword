[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lensword-cli"
version = "0.1.0"
description = "LensWord Local CLI: offline developer-context preview plus a bounded, policy-gated set of account workflows"
requires-python = ">=3.11"

[project.scripts]
lensword = "lensword_cli.cli:main"

[tool.setuptools.packages.find]
where = ["."]
