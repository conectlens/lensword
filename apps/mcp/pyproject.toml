[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lensword-mcp"
version = "0.1.0"
description = "Model Context Protocol stdio server for LensWord"
requires-python = ">=3.11"

[project.scripts]
lensword-mcp = "lensword_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
