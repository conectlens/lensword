<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>LensWord Capture</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>LensWord Capture</h1>

      <section id="signed-out">
        <label>Email<input id="email" type="email" required autocomplete="username"></label>
        <label>Password<input id="password" type="password" required autocomplete="current-password"></label>
        <button id="sign-in" type="button">Sign in</button>
      </section>

      <section id="signed-in" hidden>
        <p id="account" class="account"></p>
        <label>Save words into<select id="group"></select></label>
        <button id="sign-out" type="button" class="secondary">Sign out</button>
      </section>

      <p id="status" role="status"></p>
      <p class="hint">Select a word on any page, right-click it, then choose “Save to LensWord”.</p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
