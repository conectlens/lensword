id: mcp-http-keepalive-body-drain
products:
  - mcp-server
type: fixed
summary: >-
  A misdirected request to the remote MCP server (e.g. an OAuth client
  trying to register at the wrong URL) no longer corrupts the next request
  on the same connection with a garbled, confusing 501 error.
technical_summary: >-
  apps/mcp/lensword_mcp/http_transport.py's do_POST checked the request
  path, Origin, and bearer token — and returned an error for any of them —
  before ever reading the request body off the socket
  (self.rfile.read(length)). On this HTTP/1.1 keep-alive server
  (protocol_version = "HTTP/1.1"), an early-return response left the
  unread body bytes sitting in the socket buffer. The next request sent
  on that same connection had its request line corrupted by those
  leftover bytes, producing exactly the failure a real Claude.ai
  connection attempt hit in production: a POST carrying an RFC 7591
  dynamic-client-registration payload to this server's root path (not
  /mcp, since this server is the OAuth *resource*, not the *authorization
  server* — see mcp-oauth-discovery.yml) got its intended 404, but the
  undrained body corrupted the client's follow-up request into
  `Error code: 501 / Message: Unsupported method ('{"redirect_uris":[...]}
  GET')` — the leftover JSON body text glued to the next request's "GET".
  Fixed by resolving Content-Length and reading the full body (or
  deliberately closing the connection) before any other check can
  early-return: a missing/invalid Content-Length or an oversized body
  (over MAX_HTTP_BODY_BYTES) now sets self.close_connection = True instead
  of leaving an unreadable-length or deliberately-undrained body on a
  connection marked for reuse. A regression test opens one real
  http.client.HTTPConnection, sends a POST to the wrong path, then sends a
  second request on the *same* connection and asserts it gets a clean
  response rather than a stdlib 501 from a corrupted request line.
user_impact: >-
  A misbehaving or exploring client (an OAuth registration attempt,
  another server's health check, anything hitting a path other than
  /mcp) gets a clean 404 and the connection keeps working normally,
  instead of corrupting whatever request comes after it.
release_status: unreleased
breaking: false
migration: none
known_limitations:
  - This fixes the connection-corruption symptom, not the underlying
    reason an OAuth client ends up POSTing registration to this server's
    root path in the first place (most likely because the backend
    authorization server was unreachable at the time — see render-supabase-ipv4-pooler-fix.yml
    — so the client fell back to guessing an endpoint on the resource
    server's own origin). A reachable, correctly-discoverable
    authorization server remains the real fix for that flow to succeed at
    all.
compatibility:
  requires:
    server_api: null
