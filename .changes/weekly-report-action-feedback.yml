id: weekly-report-action-feedback
products:
  - web
  - desktop
type: fixed
summary: >-
  The weekly report's "Generate AI interpretation" and "Refresh factual
  snapshot" buttons now show a spinner while working and a visible message
  when they fail, instead of appearing to do nothing.
technical_summary: >-
  Both buttons in WeeklyReportPage.tsx called reportsApi.<...>().then(setReport)
  directly from onClick, with no loading state, no disabled state and no
  .catch, so a request in flight was invisible and a failed one produced an
  unhandled promise rejection with nothing rendered. Both now use Button's
  existing loading prop, which already renders a spinner and disables the
  control, so no new UI primitive was needed. A single pending-action state
  disables both buttons while either runs, since each replaces the whole
  report and racing them would leave whichever finished last silently
  winning. Action failures render inline through a separate actionError
  state, kept apart from the page-level error state that replaces the whole
  view — that is the right response to the report failing to load and the
  wrong one to a button failing. Retrying clears a previous failure.
user_impact: >-
  Pressing either button on the weekly report now gives immediate visible
  feedback, and a failure — most likely when generating the AI interpretation
  — is reported on screen with the report still readable, rather than
  silently doing nothing.
release_status: unreleased
breaking: false
migration: none
known_limitations:
  - >-
    The interpretation is generated in one request rather than streamed, so
    the feedback is a spinner for the whole wait rather than progressive
    output.
  - >-
    Verified by component tests against a mocked reports API; the buttons
    were not exercised against a live AI provider.
compatibility:
  requires:
    server_api: null
verification:
  automated_tests:
    status: passed
    commands:
      - cd apps/frontend && npm run lint
      - cd apps/frontend && npm run build
      - cd apps/frontend && npm test
    workflow_url: null
  artifact_build:
