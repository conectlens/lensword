id: fix-frontend-api-url-validation
products:
  - web
type: fixed
summary: >-
  Fixed a bug where a scheme-less VITE_API_URL silently sent every API
  request to the wrong place instead of failing clearly.
technical_summary: >-
  apps/frontend/src/lib/runtimeConfig.ts's browser-path fallback used
  VITE_API_URL as-is with no validation. A value missing its http(s)://
  scheme (e.g. "lensword-api.conectlens.com" instead of
  "https://lensword-api.conectlens.com") doesn't fail the build — every
  fetch() call silently treats it as a relative path and resolves it
  against the page's own origin. Caught this exact way in production:
  real requests going to
  https://lensword.conectlens.com/lensword-api.conectlens.com/api/v1/...
  and failing with a confusing 405, with nothing pointing at the actual
  misconfigured environment variable. Added an explicit check
  (assertAbsoluteHttpUrl) that throws a specific, actionable error at
  first use instead.
user_impact: >-
  A misconfigured API URL now fails immediately with a clear error
  instead of silently sending every request to the wrong place with a
  confusing 405/404.
