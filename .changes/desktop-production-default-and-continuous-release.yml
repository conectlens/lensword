id: desktop-production-default-and-continuous-release
products:
  - desktop
type: added
summary: >-
  A desktop installer built by CI (either release channel) now defaults to
  the hosted production API instead of a local loopback address, and a new
  automatic "continuous build" channel publishes an always-current desktop
  build on every push to main.
technical_summary: >-
  apps/desktop/api-config/src/lib.rs's DEFAULT_API_BASE is now resolved via
  option_env!("LENSWORD_RELEASE_API_BASE") at compile time, falling back to
  the existing http://127.0.0.1:8000 literal when unset. Only CI release
  builds set that variable (.github/workflows/build-desktop-installers.yml,
  a new reusable workflow extracted from release.yml's original single-file
  form so release.yml and the new release-continuous.yml share identical
  packaging/signing logic rather than risking drift between two copies).
  cargo build/cargo tauri dev never set it, so local development is
  unaffected — verified by running the existing 25-test suite unchanged,
  then re-running with LENSWORD_RELEASE_API_BASE set and confirming the one
  test that hardcodes the loopback literal fails for exactly the expected
  reason (the compiled constant genuinely changed). The runtime
  LENSWORD_API_URL env var and api-endpoint config file both still outrank
  the compiled-in default either way, so a downloaded installer remains
  fully self-hostable.
  release-continuous.yml triggers on push to main (path-filtered to
  apps/desktop and apps/frontend), deletes and recreates a rolling
  `desktop-continuous` GitHub prerelease each time via `gh release delete`
  before invoking the shared reusable workflow — chosen specifically to
  avoid depending on unverified behavior of tauri-action's own handling of
  re-publishing to an already-existing tag.
user_impact: >-
  A LensWord Desktop installer downloaded from GitHub now works against the
  real hosted service out of the box, with no configuration step, instead
  of only working once a local backend is also running. A new
  "Continuous Build" release (tag desktop-continuous, marked prerelease)
  reflects the current tip of main and updates automatically; the existing
  desktop-v* tagged-release channel is unchanged in behavior beyond also
  getting this same production default.
release_status: unreleased
breaking: false
migration: none
known_limitations:
  - Not verified end to end against a real deploy — the production API
    (lensword-api.conectlens.com) this defaults to did not exist as a live
    service when this was written (see the Cloudflare deployment PR); a
    downloaded installer using the new default won't actually reach a
    server until that's deployed.
  - release-continuous.yml itself has not run for real (no push to main
    happened from this session) — the reusable workflow it calls is
    verified only by inspection and by the fact that release.yml's
    unchanged packaging/signing steps already work; the new
    delete-then-recreate rolling-release step is untested against a live
    GitHub Releases API.
compatibility:
  requires:
    server_api: null
verification:
  automated_tests:
    status: passed
    commands:
      - cd apps/desktop && cargo test -p lensword-api-config (25/25 passing, unchanged)
      - cd apps/desktop && LENSWORD_RELEASE_API_BASE=https://lensword-api.conectlens.com cargo test -p lensword-api-config the_default_endpoint (fails for the expected reason, confirming the override genuinely takes effect)
      - cd apps/desktop && cargo fmt --check -p lensword-api-config && cargo clippy -p lensword-api-config -- -D warnings (clean)
    workflow_url: null
  artifact_build:
    status: not_run
    artifacts: []
  manual_platform_checks:
    macos: not_applicable
    windows: not_run
    linux: not_applicable
  production_observation:
    status: not_observed
security_impact: none
documentation_required: true
date: '2026-08-07'
references:
  issues: []
  pull_requests: []
  commits: []
