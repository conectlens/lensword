id: fix-desktop-build-and-selfhost-env-gaps
products:
  - desktop
  - web
  - backend
type: fixed
summary: >-
  Fixed a desktop-installer build failure (never previously exercised by a
  real CI run) and a docker-compose self-hosting gap where Ollama/AI and
  remote-MCP settings couldn't be configured via .env.
technical_summary: >-
  apps/desktop/src-tauri/tauri.conf.json's beforeBuildCommand used
  ../../frontend, which is only correct if Tauri executes it relative to
  the config file's own directory (src-tauri/). It does not — it executes
  relative to wherever `tauri build` was invoked from (apps/desktop, per
  CONTRIBUTING.md's documented flow and this project's own tauri-action
  projectPath), where the correct relative path is one level up
  (../frontend), not two. Confirmed both the bug and the fix by actually
  running `npx @tauri-apps/cli@2 build` locally: before the fix, the
  documented beforeBuildCommand path resolved to a nonexistent sibling
  directory outside the repo (`<repo-root>/frontend` instead of
  `<repo-root>/apps/frontend`) and failed with a misleading "no
  package-lock.json" error from npm; after the fix, the frontend build
  step inside `tauri build` completes and the Rust build proceeds. This
  had never been caught because no tag was ever pushed to trigger
  release.yml, and the desktop CI job (ci.yml) only runs `cargo check`,
  which doesn't exercise beforeBuildCommand at all.

  Separately, docker-compose.yml's backend service environment: block
  passed through DATABASE_URL/SECRET_KEY/CORS_ORIGINS/FIRST_ADMIN_* but
  not AI_PROVIDER/OLLAMA_MODEL/OLLAMA_BASE_URL or
  REMOTE_MCP_ENABLED/MCP_ISSUER_URL, even though the root .env.example's
  own header comment claimed "anything set there can also be passed
  through" — for those specific settings, that claim was false. Added the
  missing passthroughs (with the same working defaults as
  apps/backend/.env.example) to docker-compose.yml, and documented them
  in the root .env.example with a pointer to
  docs/install/local-ai-ollama.md's Docker-specific OLLAMA_BASE_URL
  guidance (`localhost` inside the container is not the host machine).
  Also pinned cloudflare/wrangler-action's wranglerVersion to 4.120.0 in
  the three deploy-*.yml workflows added in #310 — the action's own
  default (observed via a real failed CI run: 4.86.0) has a
  @cloudflare/workers-types peer-dependency conflict with the version this
  project's package.json already installs (^5.x).
user_impact: >-
  A CI-built desktop installer (either release channel) now actually
  builds instead of failing during the frontend-embedding step. Cloudflare
  deploy workflows no longer fail on an npm peer-dependency conflict
  before ever reaching the actual deploy step. docker-compose-based
  self-hosters can now turn on local AI/Ollama suggestions or the remote
  MCP transport by setting a value in .env, without editing
  docker-compose.yml directly.
release_status: unreleased
breaking: false
migration: none
known_limitations:
  - The desktop build fix was verified up through the frontend-embedding
    step (beforeBuildCommand completing successfully); the full native
    Rust/Tauri compilation and installer packaging was not run to
    completion in this environment (no signing certificates, and a full
    release build takes longer than was practical to wait out here) — CI
    is the real gate for that, and this fix directly addresses the exact
    failure a real CI run on main just produced.
  - docker-compose.yml still doesn't pass through the RATE_LIMIT_* or
    DB_POOL_SIZE/DB_MAX_OVERFLOW/LOG_LEVEL/DB_ECHO/SCHEDULER_JOB_STORE
    settings — deliberately scoped to the ones a self-hoster is actually
    likely to want to change (AI/Ollama, remote MCP), not a full mirror of
    every backend setting; the root .env.example says so explicitly and
    points at apps/backend/.env.example for the rest.
compatibility:
  requires:
    server_api: null
verification:
  automated_tests:
    status: passed
    commands:
      - cd apps/desktop && npx @tauri-apps/cli@2 build (reproduced the failure before the fix, confirmed it clears after)
      - docker compose config --quiet (docker-compose.yml still valid after the environment: block additions)
      - python -c "import json; json.load(open('apps/desktop/src-tauri/tauri.conf.json'))" (valid JSON)
      - python -c "import yaml; yaml.safe_load(open(f))" for all three modified deploy-*.yml workflows
    workflow_url: null
  artifact_build:
    status: not_run
    artifacts: []
  manual_platform_checks:
    macos: not_applicable
    windows: not_run
    linux: not_applicable
  production_observation:
    status: not_observed
security_impact: none
documentation_required: false
date: '2026-08-07'
references:
  issues: []
  pull_requests: []
  commits: []
