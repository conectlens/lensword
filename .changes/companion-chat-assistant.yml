id: companion-chat-assistant
products:
  - web
  - desktop
  - backend
type: added
summary: >-
  A chat assistant is available from the main navigation on web and desktop.
  Conversations are saved to the account and can be picked up from any
  connected companion.
technical_summary: >-
  Adds POST /api/v1/companion/sessions/{id}/chat, which records the user's
  turn, asks the configured AIProvider via converse(), and records the
  answer — both as ordinary companion turns, so an in-app conversation
  stays readable, exportable and resumable through every existing
  companion route rather than living in a parallel store. The pre-existing
  POST /turns only records a turn an external MCP companion already
  produced and never calls a provider, so no endpoint could answer an
  in-app message before this. The user's turn is stored before the
  provider is called, and operation_id makes a retried send idempotent
  (the assistant half is keyed off the same id) so a retry returns the
  stored exchange instead of prompting the model twice. Frontend adds
  CompanionChatPage at /assistant, gated on the ai_companion_enabled
  recall setting, which is now exposed on the frontend RecallSettings
  type.
user_impact: >-
  Users can hold a conversation with the assistant inside the app on web and
  desktop instead of only through an external MCP client. A provider that is
  switched off or temporarily down shows an explanatory message and never
  discards what was typed; when the companion feature is off for the account,
  the screen explains that rather than failing.
release_status: unreleased
breaking: false
migration: none
known_limitations:
  - Replies are returned whole rather than streamed; the UI shows a
    "Thinking…" indicator for the duration of the call instead of
    incremental text.
  - Sessions are not listed or resumable from the UI yet — ending a chat
    starts a fresh one next time, though the finished session remains
    readable through the existing companion export route.
  - Corrections returned by the shared converse() contract are parsed but
    not displayed here; the conversation tutor at /tutor remains the
    surface that shows them.
  - Not exercised against a live AI provider in a running deployment; the
    provider interaction is covered by tests using a stubbed provider.
compatibility:
  requires:
    server_api: null
verification:
  automated_tests:
    status: passed
    commands:
      - cd apps/backend && .venv/bin/python -m pytest tests/ -k "companion or conversation"
      - cd apps/frontend && npx vitest run src/features/companion
      - cd apps/frontend && npx tsc -b
    workflow_url: null
  artifact_build:
    status: not_run
    artifacts: []
  manual_platform_checks:
    macos: not_run
    windows: not_run
    linux: not_run
  production_observation:
    status: not_observed
security_impact: >-
  The new endpoint reuses the companion router's existing per-user
  ownership check and ai_companion_enabled gate, and shares the rate_limit_ai
  budget with the other provider-calling routes. Session turns are injected
  into the prompt as data rather than instructions, consistent with the
  conversation tutor's handling of user-supplied text.
documentation_required: true
date: '2026-08-10'
references:
  issues: [343]
  pull_requests: []
  commits: []
