id: edit-group-language
products:
  - web
  - desktop
  - backend
type: added
summary: >-
  A group's name and target language can both be edited after creation, from
  an Edit button on the group card.
technical_summary: >-
  PATCH /api/v1/groups/{group_id} previously accepted only `name`
  (GroupRenameRequest) and no UI called it. The body is now
  GroupUpdateRequest, where `name` and `target_language` are each optional
  and an omitted field means "leave it alone", so the rename-only body
  existing callers send is unchanged; a body with neither field is a 422
  rather than a silent no-op. RenameGroupUseCase becomes UpdateGroupUseCase,
  applying group-level attribute changes, and Group gains a `retarget`
  method alongside `rename`. A language change invalidates the cached
  per-user language profile (issue #342) because that cache is derived from
  which languages the learner studies; a rename deliberately does not,
  since it cannot affect the profile. Frontend replaces the unused
  groupsApi.rename with groupsApi.update and adds an EditGroupModal to
  GroupsPage.
user_impact: >-
  A group created with the wrong target language no longer has to be deleted
  and rebuilt. Words already in the group keep the language they were added
  with — the editor says so before saving, rather than leaving it to be
  discovered afterwards.
release_status: unreleased
breaking: false
migration: none
known_limitations:
  - Existing words are not offered a bulk language change; retargeting a
    group that already holds vocabulary leaves those words marked with
    their original language by design, and changing them is still a
    per-word edit.
  - The edit affordance is on the group card in /groups only;
    GroupDetailPage has no group-level edit control yet.
  - Not exercised in a browser; covered by backend API tests and a
    component test for the modal.
compatibility:
  requires:
    server_api: null
verification:
  automated_tests:
    status: passed
    commands:
      - cd apps/backend && .venv/bin/python -m pytest tests/test_group_update.py tests/ -k group
      - cd apps/frontend && npx vitest run src/features/groups
      - cd apps/frontend && npx tsc -b
    workflow_url: null
  artifact_build:
    status: not_run
    artifacts: []
  manual_platform_checks:
    macos: not_run
    windows: not_run
    linux: not_run
  production_observation:
    status: not_observed
security_impact: >-
  The endpoint keeps its existing per-user ownership check, which the tenant
  isolation audit already covers for this route; target_language is
  constrained to the SupportedLanguage enum, so an arbitrary string is
  rejected at the schema boundary.
documentation_required: true
date: '2026-08-10'
references:
  issues: [337]
  pull_requests: []
  commits: []
