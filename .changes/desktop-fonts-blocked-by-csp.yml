id: desktop-fonts-blocked-by-csp
products:
  - web
  - desktop
type: fixed
summary: >-
  The desktop app's icons and headings now render correctly. They were
  invisible/wrong before: the Material Symbols icon font failed to load,
  so icon ligatures (e.g. "translate") showed as literal words instead of
  glyphs.
technical_summary: >-
  apps/frontend loaded Montserrat, Poppins, and Material Symbols Outlined
  from fonts.googleapis.com/fonts.gstatic.com via a <link> in index.html.
  The web build has no CSP and never showed a problem. The Tauri desktop
  shell's CSP (apps/desktop/src-tauri/tauri.conf.json: style-src 'self'
  'unsafe-inline'; font-src 'self' data:) blocks both origins outright, so
  in the desktop build the stylesheet link and the font files behind it
  silently failed to load. Text fell back to a system sans-serif (headings/
  body, easy to miss) and Material Symbols' ligature spans fell back to
  rendering their literal name text (e.g. "translate" — visually obvious,
  reported by a real screenshot of the register page).
  Fixed by self-hosting instead of loosening the CSP: apps/frontend/public/fonts
  now carries Montserrat (single variable-weight file, Latin unicode-range),
  Poppins (four static weights, Latin), and a glyph-subsetted Material
  Symbols Outlined file containing only the icon names src/ actually
  references (see components/ui/Icon.tsx callers) — 257KB static, vs 3.85MB
  for the full variable-axis font, since the app never toggles Icon's
  `filled` prop to true anywhere today. @font-face rules added to
  src/index.css; the Google Fonts <link>/preconnect tags removed from
  index.html. font-src/style-src 'self' already covers same-origin files,
  so no CSP change was needed or made — self-hosting fixes both build
  targets from one source without loosening either one's security policy.
user_impact: >-
  Desktop app users see real icons and the intended headings/body font
  instead of literal icon-name text and a system font fallback. No change
  for web app users (Cloudflare Pages), who never hit this.
release_status: unreleased
breaking: false
migration: none
known_limitations:
  - Montserrat/Poppins are self-hosted Latin-only (matching the weights
    already in use); non-Latin UI text (there isn't any in this app's
    chrome today) would fall back to the `sans-serif` stack rather than
    these fonts specifically.
  - The Material Symbols subset only contains the icon names in use as of
    this fix. Adding a new `<Icon name="...">` value requires regenerating
    apps/frontend/public/fonts/material-symbols-outlined.woff2 the same way
    (fonts.googleapis.com/css2?family=Material+Symbols+Outlined&text=...)
    or it will silently render as literal text again, same failure mode.
compatibility:
  requires:
    server_api: null
verification:
  automated_tests:
    status: passed
    commands:
      - cd apps/frontend && npm run build (fonts present in dist/fonts, CSS references /fonts/*.woff2)
      - cd apps/frontend && npm run lint (0 errors, pre-existing warnings only)
      - "Real verification, not just build success: served the built dist/ locally with Tauri's exact CSP injected via a <meta> tag, loaded /register (the exact page from the bug report) in a real browser — the translate icon renders as a glyph, not text; console has zero CSP-violation/font-load errors."
    workflow_url: null
  artifact_build:
    status: passed
    artifacts:
      - apps/frontend production build (dist/), inspected directly
  manual_platform_checks:
    macos: not_applicable
    windows: not_run
    linux: not_applicable
  production_observation:
    status: observed
security_impact: none
documentation_required: false
date: '2026-08-07'
references:
  issues: []
  pull_requests: []
  commits: []
