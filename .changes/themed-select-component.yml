id: themed-select-component
products:
  - web
  - desktop
type: fixed
summary: >-
  Dropdowns now open in the app's own dark styling instead of the browser's
  white system popup, and every dropdown in the app uses the same control.
technical_summary: >-
  components/ui/Select.tsx wrapped a native <select> and styled its <option>
  elements, which browsers very largely ignore because the open dropdown is
  OS-level chrome rather than part of the page — so the popup kept rendering
  light against the app's dark surface no matter what CSS was applied.
  Rebuilt on @radix-ui/react-select, an unstyled accessible listbox primitive,
  so the open list is ordinary markup the app themes itself. Radix was chosen
  over a hand-rolled listbox because the parts that are easy to get wrong are
  the ones nobody notices until someone depends on them: roving focus,
  typeahead, aria-activedescendant, returning focus to the trigger on close.
  All 16 raw <select> elements across 11 files were migrated to the shared
  component, along with the 4 existing call sites, so the audit the issue
  asked for is complete rather than partial. The API is value/onValueChange
  rather than a native change event, and gained a size variant for the
  compact inline dropdowns several toolbars use. Radix reserves the empty
  string for "nothing selected", so filters offering "Any"/"Leave unchanged"
  use an exported ANY_OPTION sentinel that call sites map back themselves.
  Test setup gained the jsdom stubs the primitive needs (hasPointerCapture,
  ResizeObserver, DOMRect) and a shared selectOption helper that drives the
  control by keyboard.
user_impact: >-
  Opening any dropdown in dark mode now shows a dark, app-styled list instead
  of a white system popup. Keyboard and screen-reader operation is preserved,
  and dropdowns look and behave identically everywhere in the app rather than
  varying by screen.
release_status: unreleased
breaking: false
migration: none
known_limitations:
  - >-
    Visual QA across light and dark themes was not performed. The change is
    verified by unit tests asserting the open list is rendered by the app
    rather than as native popup chrome, which is the structural cause of the
    bug, but no dropdown was observed in a real browser in either theme.
  - >-
    Adds a runtime dependency (@radix-ui/react-select) to a frontend that
    previously had only React, the router and the icon library. The bundle
    grows accordingly. The issue names this trade explicitly, on the grounds
    that a hand-rolled listbox trades bundle size for accessibility risk.
  - >-
    The desktop shell's Content-Security-Policy was read and does permit the
    inline styles the primitive uses for positioning (style-src 'self'
    'unsafe-inline'), but this was not confirmed by running the packaged
    desktop build.
compatibility:
  requires:
    server_api: null
verification:
  automated_tests:
    status: passed
    commands:
      - cd apps/frontend && npm run lint
      - cd apps/frontend && npm run build
      - cd apps/frontend && npm test
    workflow_url: null
  artifact_build:
    status: not_run
    artifacts: []
  manual_platform_checks:
    macos: not_run
    windows: not_run
    linux: not_run
  production_observation:
    status: not_observed
security_impact: >-
  Adds one runtime dependency, @radix-ui/react-select (MIT). It performs no
  network access and renders no caller-supplied HTML — option labels are
  passed as text children, not as markup. Accessible labelling is now
  enforced by the component's own API rather than left to each call site.
documentation_required: true
date: '2026-08-09'
references:
  issues: [341]
  pull_requests: []
  commits: []
