id: byok-ai-credentials
products:
  - web
  - desktop
  - browser-extension
  - mcp-server
  - local-cli
type: added
summary: >-
  Signed-in users can now supply their own Gemini, OpenAI, or Vertex AI key
  on the Settings page ("Bring Your Own Key") and have it used automatically
  for their own AI requests, instead of being limited to whatever the
  deployment itself is configured with (or nothing, if the deployment has
  AI switched off).
technical_summary: >-
  New user-scoped API (GET/PUT/DELETE /api/v1/me/ai-credentials[/{provider}])
  alongside the existing admin-only, deployment-wide /api/v1/ai-settings —
  no admin opt-in gate required per user.
  Provider-agnostic Strategy pattern for extensibility: CredentialSchema
  subclasses per provider (app/domain/services/ai_credentials.py, zero
  third-party imports, matching the domain layer's existing boundary)
  registered in PROVIDER_CREDENTIAL_SCHEMAS validate each provider's own
  payload shape (a bare api_key for Gemini/OpenAI; a GCP service-account
  JSON plus project_id/location for Vertex AI) and declare which fields are
  safe to echo back (Vertex's project_id/location) versus never (the
  secret). A new provider needs one schema class plus one builder function
  in app/infrastructure/ai_providers/credential_mapping.py — nothing else
  in the stack changes.
  Stored encrypted (UserAICredentialModel, migration
  20260808_01_user_ai_credentials) with application-level authenticated
  encryption (cryptography.fernet.Fernet) under one master key,
  AI_CREDENTIAL_ENCRYPTION_KEY — deliberately not a cloud KMS/Vault, to
  avoid adding a second service to this project's self-hosted-first
  Docker/Render/SQLite posture. The first reversibly-encrypted secret this
  codebase has ever stored; every other credential (passwords, OAuth
  tokens) is one-way hashed.
  resolve_ai_provider_for_user (app/api/deps.py) is the shared precedence
  policy behind every AI-serving route (twelve REST endpoints via
  PerUserAIProvider, plus the MCP invocation boundary via
  app.api.mcp_auth.get_ai_provider_for_actor, which resolves caller
  identity differently — a remote MCP OAuth token is not a login JWT): no
  stored credential falls back to the deployment default unchanged; a
  user's single stored credential is used regardless of the deployment's
  own provider; with more than one, whichever matches the deployment's own
  AI_PROVIDER wins, otherwise it falls back rather than guessing. A
  credential that exists but is currently unusable (wrong encryption key,
  unusable key material) deliberately raises the same
  AIProviderUnavailableError every other provider failure does, rather
  than silently falling back and spending the deployment's own budget on a
  user's broken personal key.
  New Settings page section (ByokCredentialsCard) mirrors the existing MCP
  connection credential field's write-only pattern: every field is
  password/textarea input, nothing is ever pre-filled from a saved value.
user_impact: >-
  A signed-in user can add, update, or remove their own Gemini/OpenAI/
  Vertex AI key from the Settings page. Once added, their own AI requests
  (mnemonic suggestions, vocabulary enrichment, the conversation tutor,
  learning paths, the companion coach) use that key automatically. No
  change for a user who does not configure one — AI features work exactly
  as before, off the deployment's own configuration.
release_status: unreleased
breaking: false
migration: none
known_limitations:
  - Fully covered by unit tests against a mocked transport only — no real
    Gemini/OpenAI/Vertex AI credentials were available to verify a live
    round trip through a user's own stored key. See
    docs/install/cloud-ai-providers.md's "Bring Your Own Key" section.
  - This is the first reversibly-encrypted secret this codebase has ever
    stored (every prior credential is one-way hashed) and handles real
    financial-risk credentials — flagged as needing a human security
    review before production use, not self-certified safe by tests
    passing.
  - A user who configures credentials for more than one provider, neither
    matching the deployment's own AI_PROVIDER, cannot currently choose
    explicitly which one is used — the system falls back to the deployment
    default in that specific case rather than guessing. No UI exists yet
    for an explicit "active provider" choice.
  - There is no key-rotation or re-encryption tooling if
    AI_CREDENTIAL_ENCRYPTION_KEY itself needs to change after credentials
    have already been stored under the old one.
compatibility:
  requires:
    server_api: null
verification:
  automated_tests:
    status: passed
    commands:
      - cd apps/backend && .venv/bin/pytest tests/test_ai_credentials_schema.py tests/test_credential_vault.py tests/test_user_ai_credential_repository.py tests/test_credential_mapping.py tests/test_ai_credentials_api.py tests/test_ai_provider_for_user.py -v
      - cd apps/backend && .venv/bin/pytest -q -k "not real_ollama" (full backend suite, regression check)
      - cd apps/frontend && npm run build (tsc -b && vite build)
    workflow_url: null
  artifact_build:
    status: not_run
    artifacts: []
  manual_platform_checks:
    macos: not_run
    windows: not_applicable
    linux: not_applicable
  production_observation:
    status: not_observed
security_impact: >-
  Adds the first reversibly-encrypted secret this codebase stores (a
  user's own AI provider credential) — application-level authenticated
  encryption (Fernet/AES) under one operator-configured master key, never
  a cloud KMS. The API never returns a stored credential's value in any
  response (checked directly against raw response text in tests, not just
  parsed JSON field names); a user's credentials are never visible or
  removable by another account (tested directly). No key-rotation tooling
  exists yet if the master key needs to change. Recommended for a focused
  human security review before production use, given the sensitivity of
  what this stores.
documentation_required: true
date: '2026-08-08'
