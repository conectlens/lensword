id: browser-notification-icon-fix
products:
  - browser-extension
type: fixed
summary: >-
  Capture notifications ("Saved to LensWord", error notifications) now
  show the LensWord icon instead of a broken image.
technical_summary: >-
  service-worker.js's three chrome.notifications.create() calls referenced
  iconUrl: 'icon.svg'. Chrome's notifications API does not support SVG
  icons (confirmed against Chrome's own extension documentation and a
  matching real-world "Unable to download all specified images" bug
  report). Fixed to reference icons/icon48.png, the PNG icon set added by
  the brand-assets work.
user_impact: >-
  Every capture notification (success or failure) now renders with a real
  icon instead of a missing-image placeholder.
release_status: unreleased
breaking: false
migration: none
known_limitations:
  - Not confirmed by loading the extension into a real Chrome instance and
    observing a live notification — chrome:// pages could not be driven by
    this documentation session's browser automation. Fix is based on
    Chrome's documented SVG limitation plus a matching reported failure,
    not a directly observed broken/fixed notification.
compatibility:
  requires:
    server_api: null
