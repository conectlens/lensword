name: Release

# Phase 3.3 (#16): produce desktop installers for all three platforms on a
# tagged release. Packaging logic lives in build-desktop-installers.yml —
# this file is just the tag-triggered channel's own trigger + release
# metadata. There used to be a second, push-to-main "continuous build"
# channel (release-continuous.yml); it was removed for producing no real
# value — an unreviewed rolling prerelease nobody looked at before it
# replaced itself on the next push. This tagged channel is the only one now.
#
# This workflow's job is to produce installers at all. It does not satisfy
# ADR 0001's release gate on its own: that gate requires *signed* builds, and
# these are unsigned unless the optional secrets below are configured. The
# measured baseline in #65 must be taken against signed artifacts, so it stays
# blocked until signing is set up, not merely until this workflow runs.
on:
  push:
    tags:
      # Namespaced per #281's versioning decision (see
      # docs/reference/trust/release-process.md) — a bare `v*` tag doesn't
      # say which LensWord product it's for, when only desktop installers
      # are actually produced here. `v*` stays supported as a legacy alias
      # since it was the only convention documented before this tag was
      # ever actually pushed (git tag -l is still empty either way).
      - "desktop-v*"
      - "v*"
  workflow_dispatch: {}

# Missing entirely until now — the repo's default workflow token permission
# is "read" (confirmed via the API), and this workflow calls
# build-desktop-installers.yml with secrets: inherit, whose own jobs need
# contents: write to create the GitHub Release. A reusable-workflow call
# can never be granted more than its caller's own token permissions, no
# matter what the callee itself declares, so without this every run of
# `release` failed before a single job started (observed on real runs: every
# desktop-v* tag ever pushed or dispatched here — 0.1.0, 0.1.1, 0.1.2 — hit
# `startup_failure` / "likely failed because of a workflow file issue").
# release-continuous.yml already had this; release.yml never did.
permissions:
  contents: write

jobs:
  compute-version:
    name: Compute display version
    runs-on: ubuntu-latest
    outputs:
      display: ${{ steps.version.outputs.display }}
    steps:
      - name: Compute display version
        id: version
        shell: bash
        run: |
          ref="${{ github.ref_name }}"
          echo "display=${ref#desktop-}" >> "$GITHUB_OUTPUT"

  release:
    name: Release
    needs: compute-version
    uses: ./.github/workflows/build-desktop-installers.yml
    secrets: inherit
    with:
      tag_name: ${{ github.ref_name }}
      display_version: ${{ needs.compute-version.outputs.display }}
      release_name: "LensWord Desktop ${{ needs.compute-version.outputs.display }}"
      release_body: |
        Desktop installers for this tag. See CHANGELOG.md for details.

        These builds are unsigned unless repository signing secrets were
        configured for this run. ADR 0001 requires signed — and on macOS,
        notarized — artifacts before the measured startup/memory baseline
        (#65) can be taken against them.
      # A draft, so a tag never publishes installers without someone
      # looking first. Whether a run was signed is not visible from the
      # workflow's own green tick.
      release_draft: true
      prerelease: false
      api_base_url: "https://lensword-api.conectlens.com"
