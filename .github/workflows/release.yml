name: Release

# Phase 3.3 (#16): produce desktop installers for all three platforms on a
# tagged release.
#
# This workflow's job is to produce installers at all. It does not satisfy
# ADR 0001's release gate on its own: that gate requires *signed* builds, and
# these are unsigned unless the optional secrets below are configured. The
# measured baseline in #65 must be taken against signed artifacts, so it stays
# blocked until signing is set up, not merely until this workflow runs.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    name: Installer (${{ matrix.platform }})
    strategy:
      # Matches ci.yml: one platform failing should still report the other two,
      # since a packaging break is usually platform-specific.
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    # Bounded for the same reason as ci.yml's desktop job: a package manager
    # waiting on a lock should fail rather than hold a runner for six hours.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Rust ships preinstalled on the GitHub-hosted runners, so rustup is used
      # directly rather than adding a third-party toolchain action — the same
      # reasoning ci.yml records for its desktop job.
      - name: Ensure a stable Rust toolchain
        run: rustup update stable && rustup default stable

      - name: Cache cargo registry and build output
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          # A separate key prefix from ci.yml's: that cache holds debug
          # artifacts from `cargo check`, which a release build cannot reuse.
          key: cargo-release-${{ runner.os }}-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: cargo-release-${{ runner.os }}-

      # Tauri links against the system webview on Linux. Same packages and same
      # rationale as ci.yml: `noninteractive` stops a prompting package from
      # blocking until timeout, and `--no-install-recommends` avoids a large
      # recommended set that is useless for linking against the headers.
      - name: Install webview build dependencies
        if: matrix.platform == 'ubuntu-latest'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf

      # An explicit step rather than tauri.conf.json's `beforeBuildCommand`.
      # `tauri::generate_context!` embeds this output, so when it is missing the
      # failure surfaces as a macro expansion error deep in the Rust build;
      # failing here instead points at the actual cause. It also keeps the
      # working directory unambiguous, which a relative `npm --prefix
      # ../../frontend` inside the Tauri config does not.
      - name: Build the frontend the shell embeds
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build and attach installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing is optional and absent by default. tauri-action skips
          # signing when these are unset, so a fork or an unconfigured
          # repository still produces (unsigned) installers rather than failing
          # the release outright. macOS notarization additionally needs
          # APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: "LensWord Desktop ${{ github.ref_name }}"
          releaseBody: |
            Desktop installers for this tag. See CHANGELOG.md for details.

            These builds are unsigned unless repository signing secrets were
            configured for this run. ADR 0001 requires signed — and on macOS,
            notarized — artifacts before the measured startup/memory baseline
            (#65) can be taken against them.
          # A draft, so a tag never publishes installers without someone
          # looking first. Whether a run was signed is not visible from the
          # workflow's own green tick.
          releaseDraft: true
          prerelease: false
