name: Deploy Frontend (Cloudflare Pages)

# Deploys apps/frontend as a static build to Cloudflare Pages whenever
# main receives changes under apps/frontend/. Unlike backend/mcp, this is
# a plain static-asset deploy (see apps/frontend/wrangler.toml) — no
# Container, no Durable Object. VITE_API_URL is baked into the build at
# compile time (Vite inlines import.meta.env.* — there is no runtime env
# var for a static SPA), so it must point at the backend Container's real
# deployed URL, set once deploy-backend.yml has run at least once.
on:
  push:
    branches: [main]
    paths:
      - "apps/frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    # See deploy-backend.yml's identical comment — secrets/vars set on the
    # "production" GitHub Environment need this to be visible to the job.
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # wrangler@4.120.0 (used below for the actual deploy) requires
          # Node >=22 — confirmed by an actual failed CI run. Node 22 builds
          # the frontend fine too, so one setup-node step covers both.
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: Build
        working-directory: apps/frontend
        env:
          # Not a secret — a client-side app's API URL is visible in its
          # own JS bundle by definition. Held as a GitHub secret anyway
          # purely so it's configurable without editing this file (e.g.
          # after moving to a custom domain).
          VITE_API_URL: ${{ secrets.PRODUCTION_API_URL }}
        run: npm run build

      - name: Ensure the Pages project exists
        # `wrangler pages deploy` does not create the project — confirmed by
        # an actual failed CI run ("The Pages project ... does not exist").
        # Idempotent: fails on every run after the first (project already
        # exists), which is fine — continue-on-error means that failure
        # never blocks the real deploy step below.
        uses: cloudflare/wrangler-action@v4
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/frontend
          wranglerVersion: "4.120.0"
          command: pages project create lensword-frontend --production-branch=main

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/frontend
          # Pinned to the version this project's config was actually
          # verified against (see deploy-backend.yml) — the action's own
          # default (observed: 4.86.0) is untested here.
          wranglerVersion: "4.120.0"
          command: pages deploy dist --project-name=lensword-frontend --branch=main
