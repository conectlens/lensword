name: Build desktop installers (reusable)

# Shared by release.yml (tag-triggered, stable/versioned releases) and
# release-continuous.yml (push-to-main-triggered, rolling "latest" builds)
# so the signing/packaging logic — the part that's actually easy to get
# subtly wrong — exists in exactly one place.
#
# Two-stage: `build` produces installers per platform as workflow artifacts
# only (no GitHub Release interaction); `publish` runs once after all three
# finish and is the single writer that creates the release and attaches
# every platform's installers together. See the `build` job's comment for
# why this replaced the earlier single-stage, shared-concurrency-group
# design.
on:
  workflow_call:
    inputs:
      tag_name:
        description: "Git tag the publish job attaches installers to (must already exist for a real tag release; a synthetic non-pushed value is fine for a rolling release — gh release create will cut it from the build commit)"
        required: true
        type: string
      display_version:
        description: "Human-readable version shown in the release name"
        required: true
        type: string
      release_name:
        required: true
        type: string
      release_body:
        required: true
        type: string
      release_draft:
        required: true
        type: boolean
      prerelease:
        required: true
        type: boolean
      # Baked into the binary at compile time (see
      # apps/desktop/api-config/src/lib.rs's DEFAULT_API_BASE) — the
      # zero-config endpoint a downloaded installer talks to.
      # LENSWORD_API_URL (runtime env) and the api-endpoint config file
      # both still outrank this, so self-hosting remains fully supported.
      api_base_url:
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Installer (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-latest, windows-latest]
    # Builds only — no release input is passed to tauri-action below, so it
    # never touches the GitHub Release. That used to be done here directly
    # (all 3 platforms attaching to the same release, serialized via a
    # shared concurrency group), which caused two distinct failure modes
    # observed on real runs: a mid-upload connection reset from concurrent
    # writers to one release (PR #318's merge), and outright job
    # cancellation, since a concurrency group only queues one waiting job at
    # a time — the third matrix leg to arrive gets cancelled by GitHub
    # before it ever starts (observed on the #333 merge to main). Publishing
    # is now a separate job below that runs once all three builds finish, so
    # there's exactly one writer to the release and no race to lose.
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # apps/desktop/src-tauri/tauri.conf.json and apps/desktop/Cargo.toml
      # carry a static checked-in version (0.1.0) — this patches it, in this
      # ephemeral checkout only, to match the tag that triggered a real
      # versioned release, so the built installer's own version metadata
      # (filenames, About dialog, tauri.conf.json's "version") isn't stuck
      # at 0.1.0 forever. Nothing here is committed or pushed back to main:
      # see release-desktop-auto-version.yml for why a bump commit to main
      # isn't viable (the branch ruleset rejects a direct push from
      # github-actions[bot]). Skipped for rolling/continuous builds, whose
      # tag_name ("desktop-continuous") isn't a real version.
      - name: Sync app version to the release tag
        if: startsWith(inputs.tag_name, 'desktop-v')
        shell: bash
        run: |
          version="${{ inputs.tag_name }}"
          version="${version#desktop-v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag_name '${{ inputs.tag_name }}' is not a plain x.y.z version after stripping 'desktop-v'; refusing to bundle a mismatched version."
            exit 1
          fi
          sed -i.bak "s/\"version\": \"[^\"]*\"/\"version\": \"$version\"/" apps/desktop/src-tauri/tauri.conf.json
          sed -i.bak "s/^version = \"[^\"]*\"/version = \"$version\"/" apps/desktop/Cargo.toml
          rm -f apps/desktop/src-tauri/tauri.conf.json.bak apps/desktop/Cargo.toml.bak
          echo "Building as version $version (from tag ${{ inputs.tag_name }})"

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Ensure a stable Rust toolchain
        run: rustup update stable && rustup default stable

      - name: Cache cargo registry and build output
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('apps/desktop/Cargo.lock') }}
          restore-keys: cargo-release-${{ runner.os }}-

      - name: Install webview build dependencies
        if: matrix.platform == 'ubuntu-latest'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf

      - name: Build the frontend the shell embeds
        working-directory: apps/frontend
        run: |
          npm ci
          npm run build

      - name: Sign the Windows build
        if: matrix.platform == 'windows-latest'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            Write-Host "No WINDOWS_CERTIFICATE secret; this build will be unsigned."
            exit 0
          }

          $pfx = Join-Path $env:RUNNER_TEMP "windows-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))

          $configPath = "apps/desktop/src-tauri/tauri.conf.json"
          if (-not (Test-Path $configPath)) {
            Write-Error "Signing config path not found: $configPath"
            exit 1
          }
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $sign = @{
            cmd  = "signtool"
            args = @(
              "sign", "/fd", "SHA256",
              "/f", $pfx,
              "/p", $env:WINDOWS_CERTIFICATE_PASSWORD,
              "/tr", "http://timestamp.digicert.com", "/td", "SHA256",
              "%1"
            )
          }
          $config.bundle | Add-Member -Name windows -Value @{ signCommand = $sign } `
            -MemberType NoteProperty -Force
          $config | ConvertTo-Json -Depth 20 | Set-Content $configPath
          Write-Host "Windows signing configured."

      - name: Build installers
        id: tauri-build
        uses: tauri-apps/tauri-action@v0
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # See apps/desktop/api-config/src/lib.rs — option_env! at compile
          # time, not a runtime var. Baking this in here, not in
          # tauri.conf.json, keeps a local `cargo tauri build` pointed at
          # localhost by default.
          LENSWORD_RELEASE_API_BASE: ${{ inputs.api_base_url }}
        with:
          projectPath: apps/desktop
          # No tagName/releaseName/releaseId: per tauri-action's docs, that's
          # what tells it to build only and skip touching any GitHub Release.
          # Publishing is the `publish` job below, once every platform's
          # build has finished.

      - name: List built artifact paths
        # actions/upload-artifact needs one path per real newline, but
        # GitHub Actions expression string literals don't interpret '\n' as
        # one — join(..., '\n') produces a literal backslash-n, so the next
        # step was searching for one bogus path containing "\n" and always
        # came up empty. $GITHUB_OUTPUT's heredoc form is what actually
        # emits real newlines.
        id: artifact-paths
        shell: bash
        env:
          ARTIFACT_PATHS_JSON: ${{ steps.tauri-build.outputs.artifactPaths }}
        run: |
          {
            echo 'paths<<ARTIFACT_PATHS_EOF'
            jq -r '.[]' <<< "$ARTIFACT_PATHS_JSON"
            echo 'ARTIFACT_PATHS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upload installers for the publish job
        uses: actions/upload-artifact@v7
        with:
          name: desktop-installer-${{ matrix.platform }}
          path: ${{ steps.artifact-paths.outputs.paths }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish release
    needs: build
    # A single failing matrix leg (e.g. macOS) makes the `build` job's own
    # conclusion "failure" even with fail-fast: false, which would normally
    # skip this job too — losing the installers every other platform did
    # produce. `!cancelled()` runs publish for any outcome except an actual
    # cancellation, so a release still goes out with whichever platforms
    # succeeded; the run as a whole still shows red from the failed leg, so
    # the broken platform doesn't go unnoticed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Download every platform's installers
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-installer-*
          path: dist
          # No merge-multiple: keep each platform's artifact in its own
          # dist/desktop-installer-<platform>/ subdirectory so a missing
          # platform (failed build, nothing uploaded) is detectable below,
          # instead of a flattened dist/ that hides which one is absent.

      - name: Note any platform missing from this release
        id: missing
        run: |
          missing=""
          for platform in macos-latest ubuntu-latest windows-latest; do
            if [ ! -d "dist/desktop-installer-$platform" ]; then
              missing="$missing $platform"
            fi
          done
          if [ -n "$missing" ]; then
            echo "Missing platform installers:$missing"
            echo "note=**Note:** this build is missing installers for:$missing — that platform's build failed. See the Actions run for this tag/commit for details. Other platforms are unaffected." >> "$GITHUB_OUTPUT"
          else
            echo "note=" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail if no platform produced an installer
        run: |
          if [ -z "$(find dist -type f -not -path '*.app/*' 2>/dev/null)" ]; then
            echo "::error::No platform produced an installer; nothing to publish."
            exit 1
          fi

      - name: Build the release notes
        env:
          BODY: ${{ inputs.release_body }}
          MISSING_NOTE: ${{ steps.missing.outputs.note }}
        run: |
          {
            echo "$BODY"
            if [ -n "$MISSING_NOTE" ]; then
              echo ""
              echo "$MISSING_NOTE"
            fi
          } > release-notes.md

      - name: Create the release and attach every installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A shallow glob (dist/*/*) breaks once a platform nests its
          # installers more than one level deep (e.g. Windows producing
          # dist/desktop-installer-windows-latest/msi/*.msi and .../nsis/*.exe)
          # — gh release create then tries to upload the intermediate
          # directory itself and fails ("read dist/msi: is a directory",
          # observed on a real run). find -type f only ever lists actual
          # files, regardless of nesting depth.
          #
          # -not -path '*.app/*' excludes the raw macOS .app bundle's own
          # internals (tauri.conf.json's targets: "all" makes tauri-action
          # emit the unpacked .app alongside the .dmg): uploading those
          # files individually collides on generic bundle-internal names
          # like Contents/_CodeSignature/CodeResources — gh release create
          # uses the basename as the asset name, so two files named
          # CodeResources produce "ReleaseAsset.name already exists"
          # (observed on a real run). The compressed .app.tar.gz sibling
          # tauri also produces isn't inside a *.app/ directory itself, so
          # it's unaffected and still gets uploaded.
          mapfile -t assets < <(find dist -type f -not -path '*.app/*')
          gh release create "${{ inputs.tag_name }}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "${{ inputs.release_name }}" \
            --notes-file release-notes.md \
            ${{ inputs.release_draft && '--draft' || '' }} \
            ${{ inputs.prerelease && '--prerelease' || '' }} \
            "${assets[@]}"
