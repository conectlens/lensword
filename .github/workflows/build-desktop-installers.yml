name: Build desktop installers (reusable)

# Shared by release.yml (tag-triggered, stable/versioned releases) and
# release-continuous.yml (push-to-main-triggered, rolling "latest" builds)
# so the signing/packaging logic — the part that's actually easy to get
# subtly wrong — exists in exactly one place. Extracted unchanged from
# release.yml's original single-workflow form; behavior for tag-triggered
# releases is not intended to change by this refactor.
on:
  workflow_call:
    inputs:
      tag_name:
        description: "Git ref/tag tauri-action attaches installers to (must already exist for a real tag release; a synthetic non-pushed value is fine for a rolling release)"
        required: true
        type: string
      display_version:
        description: "Human-readable version shown in the release name"
        required: true
        type: string
      release_name:
        required: true
        type: string
      release_body:
        required: true
        type: string
      release_draft:
        required: true
        type: boolean
      prerelease:
        required: true
        type: boolean
      # Baked into the binary at compile time (see
      # apps/desktop/api-config/src/lib.rs's DEFAULT_API_BASE) — the
      # zero-config endpoint a downloaded installer talks to.
      # LENSWORD_API_URL (runtime env) and the api-endpoint config file
      # both still outrank this, so self-hosting remains fully supported.
      api_base_url:
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Installer (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-latest, windows-latest]
    # Deliberately serializes the three platforms against each other (the
    # group name omits matrix.platform on purpose) even though nothing else
    # about them is order-dependent: all three attach installers to the same
    # GitHub Release (tag_name), and tauri-action's create-or-update-release
    # step is not safe against concurrent callers racing that one release
    # resource. Three simultaneous requests to create/fetch/attach-to one
    # release produced an intermittent connection reset mid-upload
    # ("Error: other side closed") after a fully successful Windows build —
    # observed on a real run of release-continuous.yml (PR #318's merge).
    # Costs wall-clock time (three sequential builds instead of parallel);
    # buys a release step that can't lose this race.
    concurrency:
      group: desktop-installer-release-${{ inputs.tag_name }}
      cancel-in-progress: false
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Ensure a stable Rust toolchain
        run: rustup update stable && rustup default stable

      - name: Cache cargo registry and build output
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('apps/desktop/Cargo.lock') }}
          restore-keys: cargo-release-${{ runner.os }}-

      - name: Install webview build dependencies
        if: matrix.platform == 'ubuntu-latest'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf

      - name: Build the frontend the shell embeds
        working-directory: apps/frontend
        run: |
          npm ci
          npm run build

      - name: Sign the Windows build
        if: matrix.platform == 'windows-latest'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            Write-Host "No WINDOWS_CERTIFICATE secret; this build will be unsigned."
            exit 0
          }

          $pfx = Join-Path $env:RUNNER_TEMP "windows-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))

          $configPath = "apps/desktop/src-tauri/tauri.conf.json"
          if (-not (Test-Path $configPath)) {
            Write-Error "Signing config path not found: $configPath"
            exit 1
          }
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $sign = @{
            cmd  = "signtool"
            args = @(
              "sign", "/fd", "SHA256",
              "/f", $pfx,
              "/p", $env:WINDOWS_CERTIFICATE_PASSWORD,
              "/tr", "http://timestamp.digicert.com", "/td", "SHA256",
              "%1"
            )
          }
          $config.bundle | Add-Member -Name windows -Value @{ signCommand = $sign } `
            -MemberType NoteProperty -Force
          $config | ConvertTo-Json -Depth 20 | Set-Content $configPath
          Write-Host "Windows signing configured."

      - name: Build and attach installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # See apps/desktop/api-config/src/lib.rs — option_env! at compile
          # time, not a runtime var. Baking this in here, not in
          # tauri.conf.json, keeps a local `cargo tauri build` pointed at
          # localhost by default.
          LENSWORD_RELEASE_API_BASE: ${{ inputs.api_base_url }}
        with:
          projectPath: apps/desktop
          tagName: ${{ inputs.tag_name }}
          releaseName: ${{ inputs.release_name }}
          releaseBody: ${{ inputs.release_body }}
          releaseDraft: ${{ inputs.release_draft }}
          prerelease: ${{ inputs.prerelease }}
