name: Deploy MCP Server (Cloudflare)

# Deploys apps/mcp's remote Streamable HTTP transport as a Cloudflare
# Container (see apps/mcp/wrangler.toml and cf-worker/index.ts). The stdio
# transport (this package's default, and the only transport most installs
# use) has no server to deploy — this workflow only concerns the opt-in
# remote transport (issue #196).
#
# Manual-trigger only, not on push — see deploy-backend.yml's identical
# comment: Cloudflare Containers needs the Workers Paid plan, confirmed
# unavailable right now by a real "Unauthorized" failure. render.yaml is
# the current free path.
on:
  workflow_dispatch: {}

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy MCP Container
    runs-on: ubuntu-latest
    # See deploy-backend.yml's identical comment — secrets/vars set on the
    # "production" GitHub Environment need this to be visible to the job.
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # See deploy-backend.yml's identical comment — wrangler@4.120.0
          # requires Node >=22.
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mcp/package-lock.json

      - name: Install Worker deploy tooling
        working-directory: apps/mcp
        run: npm ci

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/mcp
          # See deploy-backend.yml's identical comment — same real
          # wrangler/@cloudflare/workers-types version conflict applies here.
          wranglerVersion: "4.120.0"
          # LENSWORD_TOKEN is only needed if this deployment's backend
          # requires bearer auth for the workspace the MCP server acts as —
          # omit this secret (and the `secrets:`/`env:` lines) entirely if
          # not applicable yet. LENSWORD_API_URL/LENSWORD_MCP_WORKSPACE are
          # plain [vars] in wrangler.toml, not secrets — edit them there.
        # secrets: |
        #   LENSWORD_TOKEN
        # env:
        #   LENSWORD_TOKEN: ${{ secrets.MCP_LENSWORD_TOKEN }}
