name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

  # The same suite against Postgres, which is the supported deployment target
  # (ROADMAP 4.0). Kept as its own job rather than a second leg of the matrix
  # above, because both legs would otherwise report under one check name and a
  # dialect-specific failure would be ambiguous in the PR checks list.
  #
  # NOTE: this is not in the repository's required-status-check set, so a red
  # run here will not block a merge until it is added to branch protection.
  backend-postgres:
    name: Backend on Postgres (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    defaults:
      run:
        working-directory: apps/backend
    services:
      postgres:
        # Pinned to a major version so a new Postgres release cannot change
        # this job's meaning without a commit saying so.
        image: postgres:17
        env:
          POSTGRES_USER: lensword
          POSTGRES_PASSWORD: lensword
          POSTGRES_DB: lensword_test
        ports:
          - 5432:5432
        # Without the health check the first test can connect before the
        # server finishes initialising, which fails as a connection refused
        # that looks nothing like a startup race.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Proves the migrations run on a genuinely empty Postgres database, which
      # the suite alone would not: the fixtures build the schema from the ORM
      # metadata, so a migration that is valid only in SQLite would still let
      # every test pass.
      - name: Apply migrations to an empty database
        env:
          DATABASE_URL: postgresql+psycopg://lensword:lensword@localhost:5432/lensword_test
        run: |
          python -m alembic -c alembic.ini upgrade head
          python -m alembic -c alembic.ini downgrade base

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://lensword:lensword@localhost:5432/lensword_test
        run: python -m pytest -v

  # The MCP server and the Local CLI ship as their own Python packages and
  # were, until issue #347, the only source trees in this repository with
  # tests that CI never ran — the backend job's working-directory is
  # apps/backend, so `apps/mcp/tests` and `apps/cli/tests` were simply never
  # collected. That mattered most for exactly the code #347 touches: its
  # regression tests assert how many HTTP requests and connections a flow
  # costs, and an unrun assertion about request counts is not a guarantee.
  #
  # Both are installed from source together because neither is on PyPI yet
  # and lensword-mcp depends on lensword-cli (issue #311's package split).
  mcp-cli:
    name: MCP server and Local CLI (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install both packages from source
        run: pip install -e apps/cli -e apps/mcp pytest

      - name: Run Local CLI tests
        working-directory: apps/cli
        run: python -m pytest -v

      - name: Run MCP server tests
        working-directory: apps/mcp
        run: python -m pytest -v

  frontend:
    name: Frontend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20]
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check and build
        run: npm run build

      - name: Unit tests
        run: npm test

  desktop:
    name: Desktop shell (Rust, ${{ matrix.platform }})
    # macOS added alongside Linux for issue #84: the screen-capture/OCR code
    # is macOS-only (`cfg(target_os = "macos")`), so the Linux leg alone
    # never compiles a line of it — this job would stay green while that
    # code silently bit-rotted. Windows is not added here: nothing in this
    # crate is Windows-specific yet, so a second runner would only repeat
    # what the Linux leg already checks.
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    # Bounded so a package manager waiting on a lock fails the job instead of
    # occupying a runner until the six-hour default expires.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      # Rust ships preinstalled on the GitHub-hosted runners, so rustup is used
      # directly rather than adding a third-party toolchain action.
      - name: Add rustfmt and clippy
        run: rustup component add rustfmt clippy

      - name: Cache cargo registry and build output
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/target
          key: cargo-${{ runner.os }}-${{ hashFiles('apps/desktop/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      # `tauri::generate_context!` embeds the frontend production build, so the
      # shell cannot be compiled at all without it.
      - name: Build the frontend the shell embeds
        working-directory: apps/frontend
        run: |
          npm ci
          npm run build

      # Tauri links against the system webview on Linux; macOS's WebKit is
      # already part of the OS, so this step is Linux-only.
      #
      # `noninteractive` and `--no-install-recommends` are both load-bearing:
      # without the first, a package that wants to prompt blocks until the job
      # times out, and without the second this pulls in a large recommended set
      # that is useless for compiling against the headers.
      - name: Install webview build dependencies
        if: matrix.platform == 'ubuntu-latest'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf

      - name: Format
        working-directory: apps/desktop
        run: cargo fmt --check

      # Whole workspace, not just the validator crate. Scoping these to
      # `-p lensword-api-config` left the shell with no compiler pass at all:
      # renaming a field it consumes broke it while every check stayed green.
      - name: Clippy
        working-directory: apps/desktop
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Tests
        working-directory: apps/desktop
        run: cargo test --locked --workspace

      - name: Compile the shell
        working-directory: apps/desktop
        run: cargo check --locked --workspace

  docker-build:
    name: Docker build validation
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: apps/backend
          push: false

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: apps/frontend
          push: false
