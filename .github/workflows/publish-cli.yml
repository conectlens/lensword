name: Publish Local CLI (PyPI)

# Publishes apps/cli (the `lensword-cli` package, `lensword` entry point —
# issue #311's split from apps/mcp) to PyPI using a long-lived PYPI_API_TOKEN
# secret (repo owner: create it at pypi.org/manage/account/token/ scoped to
# the `lensword-cli` project once it exists, and add it as a secret named
# PYPI_API_TOKEN on the `pypi` environment below — see
# docs/internal/pypi-publishing.md). Triggered automatically by
# publish-cli-auto-version.yml pushing a `cli-v*` tag on every apps/cli
# change that reaches main; a manual `cli-v*` tag push or workflow_dispatch
# also works.
#
# apps/cli/pyproject.toml's checked-in version never changes on `main` —
# publish-cli-auto-version.yml only pushes a tag, it doesn't commit a bump
# (see that workflow's comment for why: the `main` branch ruleset rejects a
# direct push from github-actions[bot]). So the "verify tag matches
# pyproject.toml" step below instead syncs pyproject.toml's version to the
# tag in this ephemeral checkout, right before building — nothing here is
# committed or pushed back.
#
# publish-cli-auto-version.yml triggers this via `gh workflow run
# publish-cli.yml --ref cli-vX.Y.Z` (a real tag push from GITHUB_TOKEN
# does not cascade into starting this workflow — GitHub's anti-recursion
# guard — so it has to ask explicitly). That run's github.event_name is
# "workflow_dispatch", not "push", even though github.ref does point at
# the tag; the version-sync step below keys off github.ref_type instead
# of the event name so both a real tag push and this dispatch path work.
on:
  push:
    tags:
      - "cli-v*"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish:
    name: Build, check, and publish to PyPI
    runs-on: ubuntu-latest
    # Was pinned to a dedicated `pypi` Environment (see comment history) so
    # the repo owner could later attach required-reviewer protection here
    # without touching the token's placement. In practice no `pypi`
    # Environment was ever created and PYPI_API_TOKEN was set on
    # `production` instead — every run of this job silently saw an empty
    # secrets.PYPI_API_TOKEN and would have failed PyPI auth at the last
    # step (confirmed: `gh api .../environments` lists only `github-pages`
    # and `production`; no `pypi`). Pointing at `production`, where the
    # token actually is, fixes that. If dedicated protection for PyPI
    # publishes is wanted later, create a `pypi` Environment, move
    # PYPI_API_TOKEN onto it, and change this back.
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # apps/cli/pyproject.toml's checked-in version is static — this makes
      # the built package's version match the tag that triggered this run.
      # Only meaningful when the ref is actually a tag — a workflow_dispatch
      # run against a branch (used to test this workflow before the first
      # cli-v* tag exists) has no tag to sync from, so pyproject.toml's
      # checked-in version is used as-is.
      - name: Sync apps/cli/pyproject.toml's version to the release tag
        if: github.ref_type == 'tag'
        run: |
          tag_version="${GITHUB_REF_NAME#cli-v}"
          if ! [[ "$tag_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not a plain x.y.z version after stripping 'cli-v'; refusing to publish a mismatched version."
            exit 1
          fi
          sed -i.bak "s/^version = \"[^\"]*\"/version = \"$tag_version\"/" apps/cli/pyproject.toml
          rm -f apps/cli/pyproject.toml.bak
          echo "Publishing as version $tag_version (from tag $GITHUB_REF_NAME); not committed back to main."

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: python -m build --outdir dist apps/cli

      - name: Check the built artifacts
        run: python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
