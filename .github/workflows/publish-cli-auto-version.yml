name: Auto-version Local CLI (PyPI)

# Fully automatic release cadence for apps/cli (issue #311's split from
# apps/mcp, see docs/reference/trust/release-process.md): every push to
# `main` that touches apps/cli computes the next cli-v* patch version and
# pushes that tag. The tag push is what actually triggers publish-cli.yml's
# build/check/publish — this workflow only decides the next version number
# and cuts the tag.
#
# Does NOT commit a version bump to apps/cli/pyproject.toml on `main`. The
# `main` branch ruleset's required_status_checks rule rejects a direct push
# from the default GITHUB_TOKEN (github-actions[bot] is not one of the
# ruleset's bypass actors) — every prior run of the old commit-then-tag
# version of this workflow failed at `git push origin HEAD:main` with
# "push declined due to repository rule violations", so no cli-v* tag was
# ever created and nothing ever reached PyPI. Tags live under refs/tags/,
# outside a ruleset whose target is "branch" and whose ref_name condition
# is the default branch only, so pushing a tag from this token works where
# pushing a commit does not. publish-cli.yml now syncs pyproject.toml's
# version to match the tag inside its own (unpushed) checkout before
# building, so the published package's version still matches the tag even
# though nothing on `main` itself ever changes.
#
# Pushing the tag is NOT enough on its own to start publish-cli.yml, even
# though it's configured to trigger on a `cli-v*` tag push: GitHub does
# not run other workflows off an event caused by the default GITHUB_TOKEN
# (anti-recursion guard, documented under "Triggering a workflow from a
# workflow" — the same guard that, on the desktop side, left a real
# desktop-v0.1.1 tag sitting untouched with no build ever starting for
# it). So this workflow explicitly dispatches publish-cli.yml itself, via
# the `gh workflow run` step below, which is an ordinary API call rather
# than a cascading event and is unaffected by that guard.
on:
  push:
    branches: [main]
    paths:
      - "apps/cli/**"
  workflow_dispatch: {}

permissions:
  contents: write
  # actions: write is what lets the "Trigger the PyPI publish" step below
  # call `gh workflow run` — declaring any `permissions:` block at all
  # resets every unlisted scope to `none` (not to the repo default), so
  # this has to be listed explicitly or that step gets a 403.
  actions: write

concurrency:
  # Serializes version computation so two pushes landing close together
  # can't both read the same "latest tag" and try to push the same next
  # tag. A losing run's tag push simply fails (tag already exists) rather
  # than corrupting anything, but serializing avoids that failure outright.
  group: cli-auto-version
  cancel-in-progress: false

jobs:
  tag-next-version:
    name: Compute and push the next cli-v tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute the next cli-v patch version
        id: bump
        run: |
          latest=$(git tag -l 'cli-v*' | grep -E '^cli-v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          if [ -z "$latest" ]; then
            next="0.1.0"
          else
            version="${latest#cli-v}"
            IFS='.' read -r major minor patch <<< "$version"
            next="$major.$minor.$((patch + 1))"
          fi
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "Next CLI version: $next (previous tag: ${latest:-none})"

      - name: Push the version tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ steps.bump.outputs.next }}
        run: |
          git tag "cli-v$NEXT"
          git push origin "cli-v$NEXT"

      - name: Trigger the PyPI publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ steps.bump.outputs.next }}
        run: gh workflow run publish-cli.yml --repo "${{ github.repository }}" --ref "cli-v$NEXT"
