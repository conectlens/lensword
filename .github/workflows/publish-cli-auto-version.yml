name: Auto-version Local CLI (PyPI)

# Fully automatic release cadence for apps/cli (issue #311's split from
# apps/mcp, see docs/reference/trust/release-process.md): every push to
# `main` that touches apps/cli bumps the patch version in
# apps/cli/pyproject.toml, commits that bump, and pushes a matching
# `cli-v*` tag. The tag push is what actually triggers publish-cli.yml's
# build/check/publish — this workflow only decides the next version number
# and cuts the tag.
#
# Loop guard: the bump commit's message is tagged [auto-version]; the job
# is skipped when the triggering commit already carries that tag, since
# without that a bump commit's own push to main would trigger another bump.
on:
  push:
    branches: [main]
    paths:
      - "apps/cli/**"

permissions:
  contents: write

jobs:
  bump-and-tag:
    name: Bump patch version and tag
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[auto-version]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Bump patch version in apps/cli/pyproject.toml
        id: bump
        run: |
          current=$(python -c "import tomllib; print(tomllib.load(open('apps/cli/pyproject.toml', 'rb'))['project']['version'])")
          IFS='.' read -r major minor patch <<< "$current"
          next="$major.$minor.$((patch + 1))"
          sed -i "s/^version = \"$current\"/version = \"$next\"/" apps/cli/pyproject.toml
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        env:
          NEXT: ${{ steps.bump.outputs.next }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/cli/pyproject.toml
          git commit -m "chore(cli): auto-bump version to $NEXT [auto-version]"
          git tag "cli-v$NEXT"
          git push origin HEAD:main
          git push origin "cli-v$NEXT"
